<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpSec Редактор & Web Оптимізатор</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --panel-sub: #111827;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            padding: 0.6rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .logo {
            font-weight: 700;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge-safe {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
            font-size: 0.7rem;
            padding: 0.15rem 0.45rem;
            border-radius: 9999px;
            font-weight: 600;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-group {
            display: flex;
            background: #0b0f19;
            border-radius: 6px;
            padding: 2px;
            border: 1px solid var(--border);
        }

        button, .file-btn, select, input[type="number"] {
            background: transparent;
            color: var(--text-main);
            border: none;
            padding: 0.4rem 0.65rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.2s;
        }

        select, input[type="number"] {
            background: #0b0f19;
            border: 1px solid var(--border);
            outline: none;
            padding: 0.35rem 0.5rem;
            border-radius: 6px;
        }

        select option {
            background: #1e293b;
            color: #fff;
        }

        .file-btn {
            background: var(--accent);
        }
        .file-btn:hover {
            background: var(--accent-hover);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        button.active {
            background: var(--accent);
            color: white;
        }

        .btn-action {
            background: #334155;
        }
        .btn-action:hover {
            background: #475569;
        }

        .btn-download {
            background: var(--success);
            color: white;
            font-weight: 600;
            padding: 0.5rem 1rem;
        }
        .btn-download:hover {
            background: #059669;
        }

        .slider-control {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 0 0.3rem;
        }

        input[type="range"] {
            accent-color: var(--accent);
            cursor: pointer;
            width: 70px;
        }

        /* Нижня панель оптимізації */
        .export-bar {
            background-color: var(--panel-sub);
            border-top: 1px solid var(--border);
            padding: 0.6rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.85rem;
        }

        .export-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-muted);
        }

        .info-pill {
            background: #1e293b;
            border: 1px solid var(--border);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.78rem;
            color: #38bdf8;
            font-family: monospace;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            position: relative;
            overflow: auto;
        }

        .canvas-wrapper {
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            overflow: hidden;
            display: none;
            background: #000;
        }

        #imageCanvas {
            display: block;
            max-width: 100%;
            max-height: calc(100vh - 200px);
            object-fit: contain;
            cursor: crosshair;
        }

        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        .drop-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 3.5rem 2rem;
            text-align: center;
            max-width: 520px;
            width: 100%;
            background: var(--panel-bg);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .drop-area.dragover {
            border-color: var(--accent);
            background: rgba(37, 99, 235, 0.1);
        }

        .drop-area h2 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .drop-area p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 1.25rem;
        }

        #fileInput, #changeFileInput {
            display: none;
        }

        .hint {
            position: fixed;
            bottom: 4.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            padding: 0.35rem 0.9rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            color: var(--text-muted);
            pointer-events: none;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            🛡️ OpSec Редактор <span class="badge-safe">Client-Side (Офлайн)</span>
        </div>

        <div class="toolbar" id="toolbar" style="display: none;">
            <!-- Вибір форми -->
            <div class="btn-group" id="shapeGroup">
                <button class="shape-btn" data-shape="rect" title="Прямокутник">▭ Прямокутник</button>
                <button class="shape-btn active" data-shape="ellipse" title="Овал / Еліпс">⬭ Еліпс</button>
            </div>

            <!-- Вибір ефекту -->
            <div class="btn-group">
                <button class="tool-btn active" data-mode="blur" title="Розмиття з м'якими краями">🌫️ Розмиття</button>
                <button class="tool-btn" data-mode="pixelate" title="Пікселі">🔲 Пікселі</button>
                <button class="tool-btn" data-mode="blackout" title="Суцільна заливка">⬛ Цензура</button>
                <button class="tool-btn" data-mode="sticker" title="Стікер / Смайлик">🎭 Стікер</button>
            </div>

            <!-- Вибір стікера -->
            <div id="stickerControl" style="display: none;">
                <select id="stickerSelect" title="Оберіть маску">
                    <option value="🐱">🐱 Котик</option>
                    <option value="🐰">🐰 Зайчик</option>
                    <option value="🐶">🐶 Песик</option>
                    <option value="🦊">🦊 Лисичка</option>
                    <option value="🐻">🐻 Ведмедик</option>
                    <option value="🦉">🦉 Сова</option>
                    <option value="🥷">🥷 Ніндзя</option>
                    <option value="😎">😎 Окуляри</option>
                    <option value="🐸">🐸 Жабка</option>
                    <option value="🇺🇦">🇺🇦 Прапор</option>
                    <option value="🛡️">🛡️ Щит</option>
                    <option value="⛔">⛔ Стоп</option>
                </select>
            </div>

            <!-- Слайдер інтенсивності -->
            <div class="slider-control" id="strengthControl">
                <span>Сила:</span>
                <input type="range" id="strengthSlider" min="5" max="50" value="20">
            </div>

            <!-- Керування -->
            <button class="btn-action" id="undoBtn" title="Скасувати (Ctrl+Z)">↩️ Скасувати</button>
            <button class="btn-action" id="resetBtn" title="Повернути оригінал">🔄 Скинути</button>

            <!-- Нове фото -->
            <label class="file-btn" title="Відкрити інше фото">
                📂 Нове
                <input type="file" id="changeFileInput" accept="image/jpeg, image/png, image/webp">
            </label>
        </div>
    </header>

    <main>
        <div class="drop-area" id="dropArea">
            <div style="font-size: 3rem; margin-bottom: 0.5rem;">📷</div>
            <h2>Виберіть або перетягніть фото</h2>
            <p>Метадані (EXIF/GPS) видаляються на 100%.<br>Маскуйте чутливі зони та швидко оптимізуйте роздільну здатність для сайту.</p>
            <label class="file-btn" style="display: inline-block;">
                Обрати файл
                <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp">
            </label>
        </div>

        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="imageCanvas"></canvas>
            <canvas id="overlayCanvas"></canvas>
        </div>
    </main>

    <!-- Нижня панель Web-оптимізації -->
    <div class="export-bar" id="exportBar" style="display: none;">
        <div class="export-controls">
            <!-- Пресет розміру -->
            <div class="control-item">
                <span>Розмір:</span>
                <select id="resizePreset">
                    <option value="original">Оригінал</option>
                    <option value="1920">1920px (Full HD / Банер)</option>
                    <option value="1200" selected>1200px (Стаття сайту)</option>
                    <option value="800">800px (Соцмережі)</option>
                    <option value="custom">Власний (Ширина)...</option>
                </select>
                <input type="number" id="customWidthInput" style="display:none; width: 75px;" placeholder="px" min="100" max="8000">
            </div>

            <!-- Формат експорту -->
            <div class="control-item">
                <span>Формат:</span>
                <select id="exportFormat">
                    <option value="image/webp" selected>WebP (Найкращий для Web)</option>
                    <option value="image/jpeg">JPEG (Стандарт)</option>
                    <option value="image/png">PNG (Без втрат)</option>
                </select>
            </div>

            <!-- Якість / Стиснення -->
            <div class="control-item" id="qualityControl">
                <span>Якість:</span>
                <input type="range" id="qualitySlider" min="50" max="100" value="82">
                <span id="qualityVal" style="font-family: monospace; min-width: 32px;">82%</span>
            </div>

            <!-- Інформація про розмір -->
            <div class="info-pill" id="dimensionsInfo">...</div>
        </div>

        <button class="btn-download" id="downloadBtn">💾 Зберегти для сайту</button>
    </div>

    <div class="hint" id="statusHint">Затисніть ліву кнопку миші та виділіть область для маскування</div>

    <script>
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const changeFileInput = document.getElementById('changeFileInput');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const canvas = document.getElementById('imageCanvas');
        const overlay = document.getElementById('overlayCanvas');
        const toolbar = document.getElementById('toolbar');
        const exportBar = document.getElementById('exportBar');
        const statusHint = document.getElementById('statusHint');
        const strengthSlider = document.getElementById('strengthSlider');
        const strengthControl = document.getElementById('strengthControl');
        const stickerControl = document.getElementById('stickerControl');
        const stickerSelect = document.getElementById('stickerSelect');
        const shapeGroup = document.getElementById('shapeGroup');
        const undoBtn = document.getElementById('undoBtn');
        const resetBtn = document.getElementById('resetBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const toolBtns = document.querySelectorAll('.tool-btn');
        const shapeBtns = document.querySelectorAll('.shape-btn');

        // Елементи оптимізації
        const resizePreset = document.getElementById('resizePreset');
        const customWidthInput = document.getElementById('customWidthInput');
        const exportFormat = document.getElementById('exportFormat');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityVal = document.getElementById('qualityVal');
        const qualityControl = document.getElementById('qualityControl');
        const dimensionsInfo = document.getElementById('dimensionsInfo');

        const ctx = canvas.getContext('2d');
        const oCtx = overlay.getContext('2d');

        let currentMode = 'blur';
        let currentShape = 'ellipse';
        let originalImage = null;
        let originalFileName = 'image.jpg';
        let history = [];
        let isDrawing = false;
        let startX = 0, startY = 0;

        // Завантаження файлів
        dropArea.addEventListener('click', () => fileInput.click());
        dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.classList.add('dragover'); });
        dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) loadImage(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => { if (e.target.files.length) loadImage(e.target.files[0]); });
        changeFileInput.addEventListener('change', (e) => { if (e.target.files.length) loadImage(e.target.files[0]); });

        function loadImage(file) {
            if (!file.type.startsWith('image/')) return;
            originalFileName = file.name;
            const img = new Image();
            const objectUrl = URL.createObjectURL(file);

            img.onload = () => {
                originalImage = img;
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                overlay.width = img.naturalWidth;
                overlay.height = img.naturalHeight;

                ctx.drawImage(img, 0, 0);
                history = [ctx.getImageData(0, 0, canvas.width, canvas.height)];

                dropArea.style.display = 'none';
                canvasWrapper.style.display = 'block';
                toolbar.style.display = 'flex';
                exportBar.style.display = 'flex';
                statusHint.style.display = 'block';

                updateDimensionsInfo();
                URL.revokeObjectURL(objectUrl);
            };
            img.src = objectUrl;
        }

        // Оновлення індикатора розмірів
        function updateDimensionsInfo() {
            if (!canvas.width) return;
            const target = getTargetDimensions();
            dimensionsInfo.textContent = `${canvas.width}x${canvas.height} ➔ ${target.width}x${target.height} px`;
        }

        function getTargetDimensions() {
            const preset = resizePreset.value;
            let targetW = canvas.width;
            let targetH = canvas.height;

            if (preset === 'custom') {
                const customW = parseInt(customWidthInput.value, 10);
                if (customW && customW > 0) {
                    targetW = customW;
                    targetH = Math.round(canvas.height * (targetW / canvas.width));
                }
            } else if (preset !== 'original') {
                const maxDim = parseInt(preset, 10);
                if (canvas.width > maxDim) {
                    targetW = maxDim;
                    targetH = Math.round(canvas.height * (targetW / canvas.width));
                }
            }
            return { width: targetW, height: targetH };
        }

        // Обробники змін у налаштуваннях оптимізації
        resizePreset.addEventListener('change', () => {
            customWidthInput.style.display = (resizePreset.value === 'custom') ? 'inline-block' : 'none';
            if (resizePreset.value === 'custom' && !customWidthInput.value) {
                customWidthInput.value = Math.min(1200, canvas.width);
            }
            updateDimensionsInfo();
        });

        customWidthInput.addEventListener('input', updateDimensionsInfo);

        exportFormat.addEventListener('change', () => {
            qualityControl.style.display = (exportFormat.value === 'image/png') ? 'none' : 'flex';
        });

        qualitySlider.addEventListener('input', () => {
            qualityVal.textContent = qualitySlider.value + '%';
        });

        // Перемикання фігури
        shapeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                shapeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentShape = btn.dataset.shape;
            });
        });

        // Перемикання інструментів
        toolBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                toolBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;

                stickerControl.style.display = (currentMode === 'sticker') ? 'block' : 'none';
                strengthControl.style.display = (currentMode === 'blackout' || currentMode === 'sticker') ? 'none' : 'flex';
                shapeGroup.style.display = (currentMode === 'sticker') ? 'none' : 'flex';
            });
        });

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function createPath(targetCtx, x, y, w, h, shape) {
            targetCtx.beginPath();
            if (shape === 'rect') {
                targetCtx.rect(x, y, w, h);
            } else if (shape === 'ellipse') {
                const cx = x + w / 2;
                const cy = y + h / 2;
                const rx = Math.max(0, w / 2);
                const ry = Math.max(0, h / 2);
                targetCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const coords = getCanvasCoords(e);
            startX = coords.x;
            startY = coords.y;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const coords = getCanvasCoords(e);
            
            oCtx.clearRect(0, 0, overlay.width, overlay.height);

            const x = Math.min(startX, coords.x);
            const y = Math.min(startY, coords.y);
            const w = Math.abs(coords.x - startX);
            const h = Math.abs(coords.y - startY);

            if (currentMode === 'sticker') {
                const fontSize = Math.floor(Math.min(w, h));
                if (fontSize > 5) {
                    oCtx.font = `${fontSize}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
                    oCtx.textAlign = 'center';
                    oCtx.textBaseline = 'middle';
                    oCtx.fillText(stickerSelect.value, x + w / 2, y + h / 2);
                }
                oCtx.strokeStyle = 'rgba(37, 99, 235, 0.4)';
                oCtx.lineWidth = 1;
                oCtx.setLineDash([4, 4]);
                oCtx.strokeRect(x, y, w, h);
            } else {
                oCtx.strokeStyle = '#2563eb';
                oCtx.lineWidth = Math.max(2, canvas.width / 500);
                oCtx.setLineDash([6, 6]);
                createPath(oCtx, x, y, w, h, currentShape);
                oCtx.stroke();
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            oCtx.clearRect(0, 0, overlay.width, overlay.height);

            const coords = getCanvasCoords(e);
            const x = Math.min(startX, coords.x);
            const y = Math.min(startY, coords.y);
            const w = Math.abs(coords.x - startX);
            const h = Math.abs(coords.y - startY);

            if (w > 4 && h > 4) {
                applyEffect(x, y, w, h);
            }
        });

        function applyEffect(x, y, w, h) {
            const strength = parseInt(strengthSlider.value, 10);

            if (currentMode === 'sticker') {
                const fontSize = Math.floor(Math.min(w, h));
                ctx.save();
                ctx.font = `${fontSize}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(stickerSelect.value, x + w / 2, y + h / 2);
                ctx.restore();

            } else if (currentMode === 'blur') {
                const blurRadius = Math.max(4, Math.floor(strength * (canvas.width / 1000)));
                const pad = blurRadius * 2;
                
                const cropX = Math.max(0, x - pad);
                const cropY = Math.max(0, y - pad);
                const cropW = Math.min(canvas.width - cropX, w + pad * 2);
                const cropH = Math.min(canvas.height - cropY, h + pad * 2);

                const blurCanvas = document.createElement('canvas');
                blurCanvas.width = cropW;
                blurCanvas.height = cropH;
                const bCtx = blurCanvas.getContext('2d');
                bCtx.filter = `blur(${blurRadius}px)`;
                bCtx.drawImage(canvas, -cropX, -cropY);

                const maskCanvas = document.createElement('canvas');
                maskCanvas.width = cropW;
                maskCanvas.height = cropH;
                const mCtx = maskCanvas.getContext('2d');

                const featherRadius = Math.max(4, Math.floor(blurRadius * 0.5));
                mCtx.filter = `blur(${featherRadius}px)`;
                mCtx.fillStyle = '#ffffff';

                const localX = x - cropX;
                const localY = y - cropY;
                createPath(mCtx, localX, localY, w, h, currentShape);
                mCtx.fill();

                bCtx.filter = 'none';
                bCtx.globalCompositeOperation = 'destination-in';
                bCtx.drawImage(maskCanvas, 0, 0);

                ctx.drawImage(blurCanvas, cropX, cropY);

            } else if (currentMode === 'pixelate') {
                ctx.save();
                createPath(ctx, x, y, w, h, currentShape);
                ctx.clip();

                const sampleSize = Math.max(2, Math.floor(strength * (canvas.width / 1000)));
                const offCanvas = document.createElement('canvas');
                const offW = Math.max(1, Math.floor(w / sampleSize));
                const offH = Math.max(1, Math.floor(h / sampleSize));
                
                offCanvas.width = offW;
                offCanvas.height = offH;
                const offCtx = offCanvas.getContext('2d');
                offCtx.drawImage(canvas, x, y, w, h, 0, 0, offW, offH);

                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(offCanvas, 0, 0, offW, offH, x, y, w, h);
                ctx.imageSmoothingEnabled = true;
                ctx.restore();

            } else if (currentMode === 'blackout') {
                ctx.save();
                createPath(ctx, x, y, w, h, currentShape);
                ctx.fillStyle = '#000000';
                ctx.fill();
                ctx.restore();
            }

            history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            if (history.length > 15) history.shift();
        }

        undoBtn.addEventListener('click', undo);
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                undo();
            }
        });

        function undo() {
            if (history.length > 1) {
                history.pop();
                const previousState = history[history.length - 1];
                ctx.putImageData(previousState, 0, 0);
            }
        }

        resetBtn.addEventListener('click', () => {
            if (!originalImage) return;
            if (confirm('Скинути всі зміни та повернути початкове фото?')) {
                ctx.drawImage(originalImage, 0, 0);
                history = [ctx.getImageData(0, 0, canvas.width, canvas.height)];
            }
        });

        // ЕКСПОРТ: Зміна розміру + Стиснення + Видалення EXIF
        downloadBtn.addEventListener('click', () => {
            if (!canvas.width) return;

            const target = getTargetDimensions();
            const format = exportFormat.value;
            const quality = parseInt(qualitySlider.value, 10) / 100;

            // Створюємо масштабоване вихідне полотно
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = target.width;
            exportCanvas.height = target.height;

            const expCtx = exportCanvas.getContext('2d');
            // Високоякісне білінійне згладжування при зменшенні
            expCtx.imageSmoothingEnabled = true;
            expCtx.imageSmoothingQuality = 'high';
            expCtx.drawImage(canvas, 0, 0, target.width, target.height);

            // Визначення розширення файлу
            let ext = '.webp';
            if (format === 'image/jpeg') ext = '.jpg';
            if (format === 'image/png') ext = '.png';

            const cleanName = 'dsszzi_clean_' + originalFileName.replace(/\.[^/.]+$/, "") + ext;

            exportCanvas.toBlob((blob) => {
                const link = document.createElement('a');
                link.download = cleanName;
                link.href = URL.createObjectURL(blob);
                link.click();
                URL.revokeObjectURL(link.href);
            }, format, quality);
        });
    </script>
</body>
</html>
