<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Очищувач EXIF та Геоданих</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .drop-zone {
            border: 2px dashed var(--primary);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            background: #eff6ff;
            transition: all 0.2s ease;
        }

        .drop-zone.dragover {
            background: #dbeafe;
            border-color: var(--primary-hover);
        }

        .drop-zone p {
            margin: 0;
            font-weight: 500;
        }

        #fileInput {
            display: none;
        }

        .file-list {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fdfdfd;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            overflow: hidden;
        }

        .file-info img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }

        .file-name {
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
        }

        .btn-download {
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-download:hover {
            background: var(--primary-hover);
        }

        .badge {
            background: #dcfce7;
            color: #15803d;
            font-size: 0.7rem;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ Очищення EXIF та Геоданих</h1>
    <p class="subtitle">100% приватно: вся обробка відбувається у вашому браузері без завантаження на сервер.</p>

    <div class="drop-zone" id="dropZone">
        <p>Натисніть або перетягніть сюди фото (JPG, PNG, WebP)</p>
        <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp" multiple>
    </div>

    <div class="file-list" id="fileList"></div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            handleFiles(e.dataTransfer.files);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleFiles(e.target.files);
        }
    });

    async function handleFiles(files) {
        for (const file of files) {
            if (!file.type.startsWith('image/')) continue;
            await processImage(file);
        }
    }

    function processImage(file) {
        return new Promise((resolve) => {
            const img = new Image();
            const objectUrl = URL.createObjectURL(file);

            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                // Отримуємо чистий Blob без EXIF
                const outputType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                canvas.toBlob((blob) => {
                    const cleanUrl = URL.createObjectURL(blob);
                    displayResult(file.name, cleanUrl, outputType);
                    URL.revokeObjectURL(objectUrl);
                    resolve();
                }, outputType, 0.95);
            };

            img.src = objectUrl;
        });
    }

    function displayResult(originalName, cleanUrl, type) {
        const ext = type === 'image/png' ? '.png' : '.jpg';
        const cleanName = 'clean_' + originalName.replace(/\.[^/.]+$/, "") + ext;

        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `
            <div class="file-info">
                <img src="${cleanUrl}" alt="preview">
                <div>
                    <div class="file-name">${originalName}</div>
                    <span class="badge">EXIF видалено</span>
                </div>
            </div>
            <a href="${cleanUrl}" download="${cleanName}" class="btn-download">Завантажити</a>
        `;
        fileList.prepend(item);
    }
</script>

</body>
</html>
